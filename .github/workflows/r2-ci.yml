name: R2 Governed Validation

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  r2-governed-validation:
    name: r2-governed-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      WORKFLOW_SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Reject cross-repository PRs
        shell: bash
        run: |
          set -euo pipefail
          test "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY"

      - name: Materialize exact trusted BASE and candidate object
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin             "refs/heads/${PR_BASE_REF}:refs/remotes/origin/r2-base"
          git fetch --no-tags origin             "refs/heads/${PR_HEAD_REF}:refs/remotes/origin/r2-head"
          test "$(git rev-parse refs/remotes/origin/r2-base)" = "$PR_BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/r2-head)" = "$PR_HEAD_SHA"
          git checkout --detach "$PR_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$PR_BASE_SHA"

      - name: Evaluate exact BASE to HEAD diff before executing trusted fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B -S scripts/base_gate.py             --mode evaluate             --repo .             --base "$PR_BASE_SHA"             --head "$PR_HEAD_SHA"

      - name: Prove trusted verifier positive and negative paths after evaluation
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B -S scripts/base_gate.py             --mode self-test             --repo .             --base "$PR_BASE_SHA"
